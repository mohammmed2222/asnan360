<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>الرئيسية – المنصة التعليمية</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .course-card {
        background-color: #fff;
        border: 1px solid #dee2e6;
        border-radius: .5rem;
        padding: 1.5rem;
        margin-bottom: 1.5rem;
        transition: box-shadow .2s;
    }
    .course-card:hover {
        box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="index.html">المنصة التعليمية</a>
      <div>
        <a href="login.html" class="btn btn-primary">تسجيل الدخول</a>
        <a href="register.html" class="btn btn-secondary">تسجيل جديد</a>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="text-center mb-5">
      <h1>📚 الدورات المتاحة</h1>
      <p class="lead text-muted">تصفح أحدث الدورات المقدمة من أفضل المدرسين.</p>
    </div>

    <div id="courses-list" class="row">
      <!-- Course cards will be injected here by JavaScript -->
    </div>
  </main>

  <script>
    window.onload = async () => {
      try {
        const response = await fetch('/api/courses');
        if (!response.ok) {
          throw new Error('Failed to fetch courses.');
        }
        const courses = await response.json();

        const coursesListDiv = document.getElementById('courses-list');
        if (courses.length === 0) {
          coursesListDiv.innerHTML = '<p class="text-center">لا توجد دورات متاحة حالياً.</p>';
          return;
        }

        coursesListDiv.innerHTML = courses.map(course => `
          <div class="col-md-6 col-lg-4">
            <div class="course-card">
              <h4>${course.title}</h4>
              <p>${course.description || 'لا يوجد وصف متاح.'}</p>
            </div>
          </div>
        `).join('');

      } catch (error) {
        console.error('Error fetching courses:', error);
        document.getElementById('courses-list').innerHTML = '<p class="text-center text-danger">حدث خطأ أثناء تحميل الدورات.</p>';
      }
    };
  </script>
</body>
</html>
