<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم – أسنان360</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f2f6fc;
      padding-top: 56px;
    }

    .navbar {
      background-color: #0077b6;
      transition: background-color 0.3s ease;
    }

    body.dark .navbar {
      background-color: #1c2541 !important;
    }

    .navbar-brand {
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 0.5px;
    }

    .card-welcome {
      background-color: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(0,0,0,0.08);
    }

    .section-title {
      font-weight: bold;
      font-size: 1.3rem;
      margin-bottom: 1rem;
    }

    .theme-toggle {
      background: #fff;
      color: #000;
      border: none;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-left: 8px;
    }

    body.dark .theme-toggle {
      background: #444;
      color: #ffd60a;
    }

    body.dark {
      background-color: #0b132b !important;
      color: #f1f1f1;
    }

    body.dark .card-welcome {
      background-color: #1c2541 !important;
      color: #eee;
    }

    body.dark .bg-light {
      background-color: #323d5c !important;
      color: #ddd;
    }

    body.dark h3,
    body.dark .section-title,
    body.dark p {
      color: #f1f1f1 !important;
    }

    body.dark .text-muted {
      color: #ccc !important;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow-sm">
    <div class="container d-flex justify-content-between align-items-center">
      <a class="navbar-brand" href="dashboard.html">أسنان360</a>
      <div>
        <button id="toggleTheme" class="theme-toggle">🌙</button>
        <button class="btn btn-warning btn-sm text-dark" onclick="logout()">تسجيل الخروج</button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <div class="card-welcome">
      <h3 id="welcome-message" class="mb-4">👋 مرحبًا بك في لوحتك الخاصة</h3>

      <!-- Add Course Form -->
      <div class="mb-5">
        <h4 class="section-title">➕ إضافة دورة جديدة</h4>
        <form id="add-course-form">
          <div class="mb-3">
            <input type="text" id="course-title" class="form-control" placeholder="عنوان الدورة" required>
          </div>
          <div class="mb-3">
            <textarea id="course-description" class="form-control" placeholder="وصف الدورة"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">إضافة الدورة</button>
        </form>
      </div>

      <!-- My Courses List -->
      <div>
        <h4 class="section-title">📚 دوراتي الحالية</h4>
        <div class="table-responsive">
          <table class="table table-striped">
            <thead>
              <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="courses-table-body">
              <!-- Teacher's courses will be injected here -->
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </div>

  <script src="teacher.js"></script>
</body>
</html>
