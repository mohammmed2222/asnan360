<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة تحكم المدير – أسنان360</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f1f5f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .sidebar {
      min-height: 100vh;
      background-color: #023e8a;
      color: #fff;
      padding: 2rem 1rem;
    }

    .sidebar a {
      display: block;
      color: #fff;
      margin-bottom: 1rem;
      text-decoration: none;
    }

    .sidebar a:hover {
      text-decoration: underline;
    }

    .admin-content {
      padding: 2rem;
    }

    .card-admin {
      background: #fff;
      border-radius: 1rem;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.05);
      padding: 1.5rem;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #023e8a;
    }
  </style>
</head>
<body>

  <div class="container-fluid">
    <div class="row">
      
      <!-- Sidebar -->
      <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
        <h4>👨‍💼 لوحة التحكم</h4>
        <a href="#" onclick="showSection('users')">👥 إدارة المستخدمين</a>
        <a href="#" onclick="showSection('courses')">📚 إدارة الكورسات</a>
        <a href="#" onclick="showSection('categories')">🗂️ إدارة الأقسام</a>
        <a href="#" onclick="logout()">🚪 تسجيل الخروج</a>
      </nav>

      <!-- Main Content -->
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 admin-content">
        <h3 class="mb-4">مرحباً بك، أيها المدير</h3>

        <!-- User Management Section -->
        <div id="users-section" class="card-admin mb-4">
          <div class="section-title">👥 قائمة المستخدمين</div>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <!-- User data will be injected here -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Course Management Section -->
        <div id="courses-section" class="card-admin mb-4" style="display:none;">
          <div class="section-title">📚 قائمة الكورسات</div>
           <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Teacher ID</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="courses-table-body">
                <!-- Course data will be injected here -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Category Management Section -->
        <div id="categories-section" class="card-admin" style="display:none;">
          <div class="section-title">🗂️ إدارة الأقسام</div>
          <form id="add-category-form" class="mb-3">
            <div class="input-group">
              <input type="text" id="category-name" class="form-control" placeholder="اسم القسم الجديد" required>
              <button type="submit" class="btn btn-primary">إضافة قسم</button>
            </div>
          </form>
          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="categories-table-body">
                <!-- Category data will be injected here -->
              </tbody>
            </table>
          </div>
        </div>

      </main>

    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
